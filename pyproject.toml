[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiowapy"
version = "0.1.0"
description = "Async WhatsApp Multi-Device client: Noise, Signal and WABinary implemented natively in Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yarfer", email = "yarfer@rs.me" }]
keywords = ["whatsapp", "asyncio", "async", "messaging", "bot", "signal", "noise", "whatsapp-web"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "cryptography>=42",
    "aiosqlite>=0.20",
    "websockets>=15",
    "protobuf>=5",
]

[project.urls]
Homepage = "https://github.com/Yarfer800/aiowapy"
Documentation = "https://yarfer800.github.io/aiowapy/"
Repository = "https://github.com/Yarfer800/aiowapy"
Issues = "https://github.com/Yarfer800/aiowapy/issues"
Changelog = "https://github.com/Yarfer800/aiowapy/blob/main/CHANGELOG.md"

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "qrcode>=8.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiowapy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src"]
